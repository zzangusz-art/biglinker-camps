<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BigLinker Camps</title>
<meta name="description" data-i18n-attr="content:meta.description">
<meta property="og:title" content="BigLinker Camps">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/img/kpop-friends.jpg">
<meta name="theme-color" content="#F2C230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="nav.skip"></a>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="2" seed="4" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.6" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="22" xChannelSelector="R" yChannelSelector="B"/>
  </filter>
</svg>

<header class="masthead" id="top">
  <div class="masthead__bar glass glass--refract">
    <a class="brand" href="#top" aria-label="BigLinker Camps"><span class="brand__big">BigLinker</span><em class="brand__camps">Camps</em></a>
    <nav class="mainnav" aria-label="BigLinker Camps">
      <a href="#lab" data-i18n="nav.lab"></a>
      <a href="#feature" data-i18n="nav.feature"></a>
      <a href="#korea" data-i18n="nav.korea"></a>
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#partners" data-i18n="nav.partners"></a>
      <a href="#journal" data-i18n="nav.journal"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="masthead__tools">
      <div class="lang" id="lang">
        <button class="lang__btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu" data-i18n-attr="aria-label:nav.lang">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.9 10h14.2M10 2.8c2 2.1 3 4.5 3 7.2s-1 5.1-3 7.2c-2-2.1-3-4.5-3-7.2s1-5.1 3-7.2Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span id="langCurrent" data-i18n="lang.name"></span>
        </button>
        <div class="lang__menu glass" id="langMenu" hidden></div>
      </div>
      <button class="btn btn--ink btn--sm masthead__cta" type="button" data-open-inquiry data-i18n="nav.cta"></button>
      <button class="iconbtn masthead__menu" id="menuBtn" type="button" aria-controls="navDrawer" data-i18n-attr="aria-label:nav.menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- Hero: Korea ↔ World map -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="wrap hero__top">
      <div class="hero__copy">
        <p class="kicker" data-i18n="hero.eyebrow"></p>
        <h1 class="hero__title display" id="heroTitle" data-i18n-html="hero.title"></h1>
        <p class="hero__deck" data-i18n="hero.deck"></p>
      </div>
      <div class="hero__ctas">
        <a class="btn btn--ink btn--lg" href="#lab" data-start-diag><span data-i18n="hero.ctaDiag"></span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
        <a class="btn btn--line btn--lg" href="#korea"><span data-i18n="hero.ctaKorea"></span></a>
      </div>
    </div>

    <div class="wrap">
      <div class="worldmap" id="worldmap" data-mode="out">
        <div class="worldmap__bar">
          <div class="dirswitch" role="group" data-i18n-attr="aria-label:map.label">
            <button class="dirswitch__btn" type="button" data-dir="out" aria-pressed="true" data-i18n="map.out"></button>
            <button class="dirswitch__btn" type="button" data-dir="in" aria-pressed="false" data-i18n="map.in"></button>
            <span class="dirswitch__thumb" aria-hidden="true"></span>
          </div>
          <p class="worldmap__note" id="mapNote" aria-live="polite"></p>
          <button class="iconbtn worldmap__play" id="mapPlay" type="button" data-i18n-attr="aria-label:map.pause" aria-pressed="false">
            <svg class="i-pause" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M7 4v12M13 4v12" stroke="currentColor" stroke-width="2"/></svg>
            <svg class="i-play" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6 4l10 6-10 6Z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="worldmap__stage" id="mapStage">
          <div class="worldmap__inner" id="mapInner" role="img" data-i18n-attr="aria-label:map.label">
            <canvas class="worldmap__canvas" id="mapCanvas" aria-hidden="true"></canvas>
            <div class="worldmap__pins" id="mapPins"></div>
            <div class="maptip glass" id="mapTip" hidden></div>
          </div>
        </div>
        <div class="worldmap__foot">
          <p class="worldmap__hint" id="mapHint"></p>
          <p class="worldmap__cap" data-i18n="map.caption"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Camp Lab -->
  <section class="sec lab" id="lab" aria-labelledby="labTitle">
    <div class="wrap">
      <header class="sec__head">
        <p class="kicker" data-i18n="lab.kicker"></p>
        <h2 class="sec__title display" id="labTitle" data-i18n-html="lab.title"></h2>
        <p class="sec__deck" data-i18n="lab.deck"></p>
      </header>

      <div class="diag" id="diag" aria-labelledby="diagTitle">
        <div class="diag__intro" id="diagIntro">
          <div class="diag__introText">
            <p class="kicker kicker--y" data-i18n="diag.kicker"></p>
            <h3 class="diag__title display" id="diagTitle" data-i18n="diag.title"></h3>
            <p class="diag__deck" data-i18n="diag.deck"></p>
            <button class="btn btn--yellow btn--lg" type="button" id="diagStart" data-i18n="diag.start"></button>
          </div>
          <ol class="diag__steps" aria-hidden="true">
            <li><span>1</span><b data-i18n="q1.t"></b></li>
            <li><span>2</span><b data-i18n="q2.t"></b></li>
            <li><span>3</span><b data-i18n="q3.t"></b></li>
            <li><span>4</span><b data-i18n="q4.t"></b></li>
            <li><span>5</span><b data-i18n="q5.t"></b></li>
            <li><span>6</span><b data-i18n="q6.t"></b></li>
          </ol>
        </div>
        <div class="diag__run" id="diagRun" hidden>
          <div class="diag__top">
            <span class="diag__count" id="diagCount"></span>
            <div class="diag__progress" aria-hidden="true"><i id="diagBar"></i></div>
            <button class="iconbtn diag__x" type="button" id="diagClose" data-i18n-attr="aria-label:diag.close"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5"/></svg></button>
          </div>
          <div class="diag__q" id="diagQ"></div>
          <div class="diag__nav">
            <button class="linkbtn linkbtn--inv" type="button" id="diagPrev" data-i18n="diag.prev"></button>
            <span class="diag__spacer"></span>
            <button class="linkbtn linkbtn--inv" type="button" id="diagSkip" data-i18n="diag.skip"></button>
            <button class="btn btn--yellow" type="button" id="diagNext" data-i18n="diag.next"></button>
          </div>
        </div>
        <div class="diag__result" id="diagResult" hidden aria-live="polite"></div>
      </div>

      <div class="lablist">
        <h3 class="subhead" data-i18n="lab.listTitle"></h3>
        <div class="quick">
          <p class="quick__q" data-i18n="lab.quick"></p>
          <div class="quick__grid">
            <button class="quick__item" type="button" data-quick="family"><span class="quick__t" data-i18n="quick.family.t"></span><span class="quick__d" data-i18n="quick.family.d"></span></button>
            <button class="quick__item" type="button" data-quick="school"><span class="quick__t" data-i18n="quick.school.t"></span><span class="quick__d" data-i18n="quick.school.d"></span></button>
            <button class="quick__item" type="button" data-quick="activity"><span class="quick__t" data-i18n="quick.activity.t"></span><span class="quick__d" data-i18n="quick.activity.d"></span></button>
            <button class="quick__item" type="button" data-quick="career"><span class="quick__t" data-i18n="quick.career.t"></span><span class="quick__d" data-i18n="quick.career.d"></span></button>
            <button class="quick__item" type="button" data-quick="summer"><span class="quick__t" data-i18n="quick.summer.t"></span><span class="quick__d" data-i18n="quick.summer.d"></span></button>
            <button class="quick__item" type="button" data-quick="stem"><span class="quick__t" data-i18n="quick.stem.t"></span><span class="quick__d" data-i18n="quick.stem.d"></span></button>
          </div>
        </div>

        <div class="filterbar" id="filterbar">
          <div class="filterbar__row">
            <div class="chips" id="catChips" role="group" data-i18n-attr="aria-label:f.cat"></div>
            <div class="filterbar__tools">
              <button class="btn btn--line btn--sm" id="moreFilters" type="button" aria-controls="filterDrawer">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 6h9M15 6h2M3 14h3M9 14h8" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="13.5" cy="6" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="14" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
                <span data-i18n="f.more"></span><span class="badge" id="moreCount" hidden></span>
              </button>
              <label class="select">
                <span class="vh" data-i18n="f.sort"></span>
                <select id="sortSel"></select>
              </label>
            </div>
          </div>
          <div class="filterbar__status">
            <p class="count" id="campCount" aria-live="polite"></p>
            <div class="active" id="activeFilters"></div>
            <button class="linkbtn" id="resetFilters" type="button" data-i18n="f.reset" hidden></button>
          </div>
        </div>

        <div class="grid" id="campGrid" aria-busy="true" data-i18n-attr="aria-label:lab.loading"></div>
        <div class="empty" id="campEmpty" hidden>
          <p class="empty__t display" data-i18n="lab.empty.t"></p>
          <p class="empty__d" data-i18n="lab.empty.d"></p>
          <button class="btn btn--line btn--sm" type="button" data-reset-filters data-i18n="f.reset"></button>
        </div>
        <p class="notice"><strong data-i18n="lab.noticeLabel"></strong> <span data-i18n="lab.notice"></span></p>
      </div>
    </div>
  </section>

  <!-- Feature: K-POP Creative Summer -->
  <article class="sec feature" id="feature" aria-labelledby="featureTitle">
    <div class="wrap">
      <header class="sec__head">
        <p class="kicker" data-i18n="feature.kicker"></p>
        <h2 class="sec__title display" id="featureTitle" data-i18n="feature.title"></h2>
        <p class="sec__deck feature__sub" data-i18n="feature.sub"></p>
      </header>

      <figure class="feature__hero">
        <div class="frame frame--feature is-loading"><img src="assets/img/kpop-showcase.jpg" width="900" height="520" loading="lazy" data-i18n-attr="alt:cap.showcase"></div>
        <figcaption class="cap"><span class="cap__no" data-fig="01"></span> <span data-i18n="cap.showcase"></span> <span class="cap__credit" data-i18n="credit.real"></span></figcaption>
      </figure>

      <div class="feature__cols">
        <div class="feature__text prose">
          <p class="lede" data-i18n="feature.lead"></p>
          <p data-i18n="feature.body1"></p>
          <blockquote class="pull display"><p data-i18n="feature.pull"></p></blockquote>
          <p data-i18n="feature.body2"></p>
          <dl class="modules">
            <div class="module"><dt data-i18n="feature.mod1.t"></dt><dd data-i18n="feature.mod1.d"></dd></div>
            <div class="module"><dt data-i18n="feature.mod2.t"></dt><dd data-i18n="feature.mod2.d"></dd></div>
            <div class="module"><dt data-i18n="feature.mod3.t"></dt><dd data-i18n="feature.mod3.d"></dd></div>
            <div class="module"><dt data-i18n="feature.mod4.t"></dt><dd data-i18n="feature.mod4.d"></dd></div>
          </dl>
        </div>
        <aside class="factbox" aria-labelledby="factTitle">
          <figure class="factbox__fig">
            <div class="frame frame--3x2 is-loading"><img src="assets/img/kpop-friends.jpg" width="1282" height="855" loading="lazy" data-i18n-attr="alt:hero.caption"></div>
            <figcaption class="cap"><span class="cap__no" data-fig="02"></span> <span data-i18n="hero.caption"></span> <span class="cap__credit" data-i18n="credit.real"></span></figcaption>
          </figure>
          <h3 class="factbox__title" id="factTitle" data-i18n="feature.facts"></h3>
          <dl class="factbox__list">
            <div><dt data-i18n="fact.len.k"></dt><dd data-i18n="fact.len.v"></dd></div>
            <div><dt data-i18n="fact.age.k"></dt><dd data-i18n="fact.age.v"></dd></div>
            <div><dt data-i18n="fact.lang.k"></dt><dd data-i18n="fact.lang.v"></dd></div>
            <div><dt data-i18n="fact.where.k"></dt><dd data-i18n="fact.where.v"></dd></div>
            <div><dt data-i18n="fact.final.k"></dt><dd data-i18n="fact.final.v"></dd></div>
          </dl>
          <button class="btn btn--yellow btn--block" type="button" data-open-inquiry data-role="student" data-interest-text="K-POP Creative Summer" data-i18n="feature.cta"></button>
        </aside>
      </div>

      <div class="feature__gallery">
        <figure class="g-vocal">
          <div class="frame frame--3x2 is-loading"><img src="assets/img/kpop-vocal.jpg" width="1536" height="1024" loading="lazy" data-i18n-attr="alt:cap.vocal"></div>
          <figcaption class="cap"><span class="cap__no" data-fig="03"></span> <span data-i18n="cap.vocal"></span> <span class="cap__credit" data-i18n="credit.staged"></span></figcaption>
        </figure>
        <figure class="g-forest">
          <div class="frame frame--3x4 is-loading"><img src="assets/img/seoul-forest.jpg" width="675" height="900" loading="lazy" data-i18n-attr="alt:cap.forest"></div>
          <figcaption class="cap"><span class="cap__no" data-fig="04"></span> <span data-i18n="cap.forest"></span> <span class="cap__credit" data-i18n="credit.real"></span></figcaption>
        </figure>
        <figure class="g-dance">
          <div class="frame frame--16x9 is-loading"><img src="assets/img/kpop-dance.jpg" width="700" height="394" loading="lazy" data-i18n-attr="alt:cap.dance"></div>
          <figcaption class="cap"><span class="cap__no" data-fig="05"></span> <span data-i18n="cap.dance"></span> <span class="cap__credit" data-i18n="credit.real"></span></figcaption>
        </figure>
        <figure class="g-broadcast">
          <div class="frame frame--3x2 is-loading"><img src="assets/img/broadcast-room.jpg" width="700" height="467" loading="lazy" data-i18n-attr="alt:cap.broadcast"></div>
          <figcaption class="cap"><span class="cap__no" data-fig="06"></span> <span data-i18n="cap.broadcast"></span> <span class="cap__credit" data-i18n="credit.real"></span></figcaption>
        </figure>
      </div>
    </div>
  </article>

  <!-- Camps in Korea (black page) -->
  <section class="sec korea" id="korea" aria-labelledby="koreaTitle">
    <div class="wrap">
      <header class="sec__head">
        <p class="kicker kicker--y" data-i18n="korea.kicker"></p>
        <h2 class="sec__title display" id="koreaTitle" data-i18n-html="korea.title"></h2>
        <p class="sec__deck" data-i18n="korea.deck"></p>
      </header>
      <ul class="index" id="koreaIndex">
        <li><button class="index__row" type="button" data-korea="p1" data-img="kpop-vocal.jpg" data-staged><span class="index__t display" data-i18n="korea.p1.t"></span><span class="index__d" data-i18n="korea.p1.d"></span><svg class="index__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></li>
        <li><button class="index__row" type="button" data-korea="p2" data-img="kpop-friends.jpg"><span class="index__t display" data-i18n="korea.p2.t"></span><span class="index__d" data-i18n="korea.p2.d"></span><svg class="index__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></li>
        <li><button class="index__row" type="button" data-korea="p3" data-img="broadcast-room.jpg"><span class="index__t display" data-i18n="korea.p3.t"></span><span class="index__d" data-i18n="korea.p3.d"></span><svg class="index__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></li>
        <li><button class="index__row" type="button" data-korea="p4" data-img="seoul-campus.jpg" data-staged><span class="index__t display" data-i18n="korea.p4.t"></span><span class="index__d" data-i18n="korea.p4.d"></span><svg class="index__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></li>
        <li><button class="index__row" type="button" data-korea="p5" data-img="kpop-showcase.jpg" data-role="school"><span class="index__t display" data-i18n="korea.p5.t"></span><span class="index__d" data-i18n="korea.p5.d"></span><svg class="index__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></li>
        <li><button class="index__row" type="button" data-korea="p6" data-img="seoul-forest.jpg"><span class="index__t display" data-i18n="korea.p6.t"></span><span class="index__d" data-i18n="korea.p6.d"></span><svg class="index__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></li>
      </ul>
      <div class="korea__foot">
        <p data-i18n="korea.note"></p>
        <button class="btn btn--yellow" type="button" data-open-inquiry data-role="school" data-i18n="korea.cta"></button>
      </div>
    </div>
    <div class="hoverimg" id="hoverImg" aria-hidden="true"><img alt=""><span class="hoverimg__tag"></span></div>
  </section>

  <!-- How we work -->
  <section class="sec how" id="how" aria-labelledby="howTitle">
    <div class="wrap">
      <header class="sec__head">
        <p class="kicker" data-i18n="how.kicker"></p>
        <h2 class="sec__title display" id="howTitle" data-i18n-html="how.title"></h2>
        <p class="sec__deck" data-i18n="how.deck"></p>
      </header>

      <div class="how__grid">
        <div class="how__media">
          <figure class="how__fig is-active" data-media="a">
            <div class="frame frame--3x2 is-loading"><img src="assets/img/prep-kit.jpg" width="1536" height="1024" loading="lazy" data-i18n-attr="alt:cap.prep"></div>
            <figcaption class="cap"><span class="cap__no" data-fig="07"></span> <span data-i18n="cap.prep"></span> <span class="cap__credit" data-i18n="credit.staged"></span></figcaption>
          </figure>
          <figure class="how__fig" data-media="b">
            <div class="frame frame--3x2 frame--top is-loading"><img src="assets/img/departure.jpg" width="1024" height="1536" loading="lazy" data-i18n-attr="alt:cap.departure"></div>
            <figcaption class="cap"><span class="cap__no" data-fig="08"></span> <span data-i18n="cap.departure"></span> <span class="cap__credit" data-i18n="credit.staged"></span></figcaption>
          </figure>
        </div>
        <ol class="steps" id="steps">
          <li class="step" data-step="1" data-media="a"><span class="step__no"><span data-i18n="how.stepLabel"></span> 01</span><h3 class="step__t" data-i18n="step1.t"></h3><p data-i18n="step1.d"></p></li>
          <li class="step" data-step="2" data-media="a"><span class="step__no"><span data-i18n="how.stepLabel"></span> 02</span><h3 class="step__t" data-i18n="step2.t"></h3><p data-i18n="step2.d"></p></li>
          <li class="step" data-step="3" data-media="a"><span class="step__no"><span data-i18n="how.stepLabel"></span> 03</span><h3 class="step__t" data-i18n="step3.t"></h3><p data-i18n="step3.d"></p></li>
          <li class="step" data-step="4" data-media="b"><span class="step__no"><span data-i18n="how.stepLabel"></span> 04</span><h3 class="step__t" data-i18n="step4.t"></h3><p data-i18n="step4.d"></p></li>
          <li class="step" data-step="5" data-media="b"><span class="step__no"><span data-i18n="how.stepLabel"></span> 05</span><h3 class="step__t" data-i18n="step5.t"></h3><p data-i18n="step5.d"></p></li>
          <li class="step" data-step="6" data-media="b"><span class="step__no"><span data-i18n="how.stepLabel"></span> 06</span><h3 class="step__t" data-i18n="step6.t"></h3><p data-i18n="step6.d"></p></li>
        </ol>
      </div>

      <div class="how__lower">
        <div class="principles">
          <h3 class="subhead" data-i18n="pr.title"></h3>
          <ul class="principles__list">

          <label class="field__label" for="f-when" data-i18n="form.when"></label>
          <select class="input" id="f-when" name="when">
            <option value="winter" data-i18n="when.winter"></option>
            <option value="spring" data-i18n="when.spring"></option>
            <option value="summer" data-i18n="when.summer"></option>
            <option value="undecided" data-i18n="when.undecided"></option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field__label" for="f-interest"><span data-i18n="form.interest"></span> <span class="opt" data-i18n="form.optional"></span></label>
        <input class="input" id="f-interest" name="interest" type="text" data-i18n-attr="placeholder:form.interestPh">
      </div>
      <div class="field">
        <label class="field__label" for="f-msg"><span data-i18n="form.msg"></span> <span class="opt" data-i18n="form.optional"></span></label>
        <textarea class="input" id="f-msg" name="msg" rows="4" data-i18n-attr="placeholder:form.msgPh"></textarea>
      </div>
      <label class="check" for="f-consent"><input type="checkbox" id="f-consent" name="consent" aria-describedby="e-consent"><span data-i18n="form.consent"></span></label>
      <p class="err" id="e-consent" hidden data-i18n="form.errConsent"></p>
      <button class="btn btn--ink btn--block" type="submit" data-i18n="form.submit"></button>
    </form>
    <div class="done" id="inqDone" hidden>
      <p class="done__t display" data-i18n="form.doneTitle"></p>
      <p class="done__d" data-i18n="form.doneDeck"></p>
      <label class="vh" for="f-summary" data-i18n="form.title"></label>
      <textarea class="input done__text" id="f-summary" rows="10" readonly></textarea>
      <div class="done__actions">
        <button class="btn btn--ink" type="button" id="copySummary" data-i18n="form.copy"></button>
        <a class="btn btn--line" id="mailSummary" href="mailto:biglinkerkor@gmail.com" data-i18n="form.mail"></a>
        <button class="linkbtn" type="button" id="editInquiry" data-i18n="form.edit"></button>
      </div>
    </div>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/data.js" defer></script>
<script src="assets/worldmap.js" defer></script>
<script src="i18n/ko.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
